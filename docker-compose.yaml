services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    volumes:
      - ./otel-config.yaml:/etc/otel/config.yaml
    command: --config /etc/otel/config.yaml
    environment:
      - APPD_HOST
      - APPD_PORT
      - APPD_ACCOUNT
      - APPD_API_KEY
      - APPD_REGION
    ports:
      - "1777:1777"   # pprof extension
      - "8888:8888"   # Prometheus metrics exposed by the collector
      - "13133:13133" # health_check extension
      - "55679:55679" # zpages extension
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP gRPC receiver
      - "8889:8889"   # Prometheus metrics exporter (scrape endpoint)

  client:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: client
    environment:
      # OpenTelemetry environmental variables:
      OTEL_SERVICE_NAME: "test-client"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      SERVER_URL: "http://server:8080"
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=${APPD_SERVICE_NAMESPACE}"
    depends_on:
      - server
      - otel-collector
    restart:
        on-failure
  server:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: server
    environment:
      # OpenTelemetry environmental variables:
      OTEL_SERVICE_NAME: "test-server"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=${APPD_SERVICE_NAMESPACE}"
    depends_on:
      - otel-collector
